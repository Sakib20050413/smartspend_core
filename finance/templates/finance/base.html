<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finance Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-gray-800 p-4 text-white">
        <div class="container mx-auto flex justify-between">
            <div>
                <a href="/" class="text-xl font-bold">Finance Tracker</a>
            </div>
            <div>
                {% if user.is_authenticated %}
                    <a href="/" class="mx-4">Dashboard</a>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="mx-4 text-red-400">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="mx-4">Login</a>
                    <a href="{% url 'register' %}" class="mx-4">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-10">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
