<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finance Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-gray-800 p-4 text-white">
        <div class="container mx-auto flex justify-between">
            <div>
                <a href="/" class="text-xl font-bold">Finance Tracker</a>
            </div>
            <div>
                {% if user.is_authenticated %}
                    <a href="/" class="mx-4 font-bold text-white hover:text-gray-300">Dashboard</a>
                    <a href="{% url 'transaction_list' %}" class="mx-4 text-white hover:text-gray-300">History</a>
                    <a href="{% url 'add_transaction' %}" class="mx-4 text-green-400 font-bold hover:text-green-300">+ Add Transaction</a>
                    <a href="{% url 'add_goal' %}" class="mx-4 text-blue-400 font-bold hover:text-blue-300">+ Add Goal</a>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="mx-4 text-red-400 hover:text-red-300">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="mx-4">Login</a>
                    <a href="{% url 'register' %}" class="mx-4">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-10">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
